<!-- =====================================
     ..M AutoTrade AI
     Profile Page
     ===================================== -->

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AutoTrade AI</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================
         ..M App
         ===================================== -->

    <main class="app">


        <!-- =====================================
             ..M Header
             ===================================== -->

        <header class="top-header">

            <div class="brand">

                <div class="brand-icon">
                    AI
                </div>

                <div class="brand-text">

                    <strong>
                        AutoTrade AI
                    </strong>

                    <span>
                        هوش مصنوعی معاملات
                    </span>

                </div>

            </div>


            <button
                id="notificationBtn"
                class="notification-button"
                type="button"
            >

                🔔

            </button>

        </header>


        <!-- =====================================
             ..M Profile
             ===================================== -->

        <section
            id="page-profile"
            class="page active"
        >


            <div class="page-heading">

                <h1>
                    پروفایل
                </h1>

                <p>
                    حساب کاربری
                </p>

            </div>


            <!-- =====================================
                 ..M User Information
                 ===================================== -->

            <section class="profile-card">

                <div class="profile-card-header">

                    <div class="profile-avatar">
                        <span id="profileInitial">
                            A
                        </span>
                    </div>

                    <div class="profile-title">

                        <strong id="profileName">
                            کاربر
                        </strong>

                        <span>
                            اطلاعات کاربر
                        </span>

                    </div>

                </div>


                <div class="profile-info-list">


                    <!-- User ID -->

                    <div class="profile-info-row">

                        <div class="info-icon">
                            #
                        </div>

                        <div class="info-content">

                            <span>
                                آیدی کاربر
                            </span>

                            <strong id="userTelegramId">
                                0
                            </strong>

                        </div>

                    </div>


                    <!-- Name -->

                    <div class="profile-info-row">

                        <div class="info-icon">
                            A
                        </div>

                        <div class="info-content">

                            <span>
                                نام و نام خانوادگی
                            </span>

                            <strong id="userFullName">
                                کاربر
                            </strong>

                        </div>

                    </div>


                    <!-- Phone -->

                    <div class="profile-info-row">

                        <div class="info-icon">
                            ☎
                        </div>

                        <div class="info-content">

                            <span>
                                شماره تلفن
                            </span>

                            <strong id="userPhone">
                                ثبت نشده
                            </strong>

                        </div>

                    </div>


                </div>

            </section>


            <!-- =====================================
                 ..M Support
                 ===================================== -->

            <section class="support-card">

                <div class="support-icon">
                    ?
                </div>


                <div class="support-content">

                    <strong>
                        پشتیبانی
                    </strong>

                    <span>
                        نیاز به کمک دارید؟
                    </span>

                </div>


                <button
                    type="button"
                    id="supportButton"
                >
                    پیام به پشتیبانی
                </button>

            </section>


        </section>


        <!-- =====================================
             ..M Bottom Navigation
             ===================================== -->

        <nav class="bottom-navigation">


            <button
                class="nav-item"
                data-page="home"
                type="button"
            >

                <span class="nav-icon">
                    ⌂
                </span>

                <span>
                    خانه
                </span>

            </button>


            <button
                class="nav-item"
                data-page="wallet"
                type="button"
            >

                <span class="nav-icon">
                    ◇
                </span>

                <span>
                    کیف پول
                </span>

            </button>


            <button
                class="nav-item"
                data-page="trades"
                type="button"
            >

                <span class="nav-icon">
                    ↗
                </span>

                <span>
                    معاملات
                </span>

            </button>


            <button
                class="nav-item"
                data-page="analytics"
                type="button"
            >

                <span class="nav-icon">
                    ◐
                </span>

                <span>
                    تحلیل
                </span>

            </button>


            <button
                class="nav-item active"
                data-page="profile"
                type="button"
            >

                <span class="nav-icon">
                    ○
                </span>

                <span>
                    پروفایل
                </span>

            </button>


        </nav>


    </main>


    <!-- =====================================
         ..M Profile Data
         ===================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                loadTelegramUser();

                initSupport();

            }
        );


        // =====================================
        // ..M Telegram User
        // =====================================

        function loadTelegramUser() {

            try {

                const tg =
                    window.Telegram &&
                    window.Telegram.WebApp;


                if (!tg) {

                    return;

                }


                tg.ready();


                const user =
                    tg.initDataUnsafe &&
                    tg.initDataUnsafe.user;


                if (!user) {

                    return;

                }


                // ..M Telegram ID

                const telegramId =
                    user.id || 0;


                const idElement =
                    document.getElementById(
                        "userTelegramId"
                    );


                if (idElement) {

                    idElement.textContent =
                        telegramId;

                }


                // ..M Full Name

                const firstName =
                    user.first_name || "";


                const lastName =
                    user.last_name || "";


                const fullName =
                    `${firstName} ${lastName}`
                        .trim();


                const nameElement =
                    document.getElementById(
                        "userFullName"
                    );


                const profileName =
                    document.getElementById(
                        "profileName"
                    );


                if (fullName) {

                    if (nameElement) {

                        nameElement.textContent =
                            fullName;

                    }


                    if (profileName) {

                        profileName.textContent =
                            fullName;

                    }

                }


                // ..M Avatar

                const initialElement =
                    document.getElementById(
                        "profileInitial"
                    );


                if (
                    initialElement &&
                    firstName
                ) {

                    initialElement.textContent =
                        firstName
                            .charAt(0)
                            .toUpperCase();

                }


            } catch (error) {

                console.log(
                    "Telegram user error:",
                    error
                );

            }

        }


        // =====================================
        // ..M Support
        // =====================================

        function initSupport() {

            const button =
                document.getElementById(
                    "supportButton"
                );


            if (!button) {

                return;

            }


            button.addEventListener(
                "click",
                () => {

                    const url =
                        "https://t.me/mehdi2410l";


                    if (
                        window.Telegram &&
                        window.Telegram.WebApp &&
                        window.Telegram.WebApp.openTelegramLink
                    ) {

                        window.Telegram.WebApp.openTelegramLink(
                            url
                        );

                        return;

                    }


                    window.open(
                        url,
                        "_blank"
                    );

                }
            );

        }

    </script>


    <script src="app.js"></script>

</body>

</html>
