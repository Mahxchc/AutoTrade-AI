<!DOCTYPE html>
<html>

<head>

<title>AutoTrade AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body {
    font-family: Arial;
    background:#101522;
    color:white;
    text-align:center;
    padding:30px;
}


.card {
    background:#1c2538;
    border-radius:20px;
    padding:25px;
    margin:20px;
}


button {

    background:#3b82f6;
    color:white;
    border:0;
    padding:15px 30px;
    border-radius:15px;
    font-size:18px;

}


.status {

    margin-top:20px;
    font-size:18px;

}


</style>

</head>


<body>


<h1>🤖 AutoTrade AI</h1>


<div class="card" id="mainCard">


<h2>Welcome</h2>


<p id="user">
Telegram Connected ✅
</p>


<button onclick="startApp()">

Connect AutoTrade AI

</button>


</div>



<script>


let tg = window.Telegram.WebApp;


tg.ready();



let user = tg.initDataUnsafe.user;



if(user){

document.getElementById("user").innerHTML =
"Hello " + user.first_name + " 👋";

}

else{

document.getElementById("user").innerHTML =
"Telegram user not detected";

}




function startApp(){


tg.expand();



document.getElementById("mainCard").innerHTML = `


<h2>Dashboard 🚀</h2>


<p class="status">
🤖 AutoTrade AI Ready
</p>


<p>
Telegram Connection: ✅
</p>


<button onclick="trade()">

Start AI Trading

</button>


`;



}



function trade(){


alert("AI Trading Engine Started 🚀");


}



</script>


</body>

</html>
