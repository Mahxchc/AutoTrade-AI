<!DOCTYPE html>
<html>

<head>

<title>AutoTrade AI Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
padding-bottom:80px;
}


.header{

padding:25px;
background:#111827;

}


.header h1{

margin:0;
color:#38bdf8;

}



.card{

background:#111827;
margin:15px;
padding:20px;
border-radius:20px;

}


.grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin:15px;

}


.stat{

background:#1e293b;
padding:15px;
border-radius:15px;

}


.number{

font-size:25px;
font-weight:bold;

color:#38bdf8;

}



.green{

color:#22c55e;

}


.red{

color:#ef4444;

}



.progress{

background:#334155;
height:10px;
border-radius:10px;

}


.progress div{

background:#22c55e;
height:10px;
border-radius:10px;
width:87%;

}



button{

width:100%;
padding:16px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
font-size:18px;

}



.trade{

display:flex;
justify-content:space-between;
padding:12px;
border-bottom:1px solid #334155;

}



.nav{

position:fixed;
bottom:0;
left:0;
right:0;
background:#111827;
display:flex;
justify-content:space-around;
padding:15px;

}



</style>

</head>


<body>



<div class="header">

<h1>🤖 AutoTrade AI</h1>

<p id="user">
Loading...
</p>

</div>




<div class="card">

<h2>Account</h2>

<div class="grid">

<div class="stat">

Balance

<div class="number">

$10,000

</div>

</div>



<div class="stat">

Profit Today

<div class="number green">

+$342

</div>

</div>


</div>


</div>





<div class="card">

<h2>
AI Engine
</h2>


<p class="green">

● Running

</p>


<p>
Strategy:
AI Crypto Scalping
</p>


<p>
Accuracy

</p>


<div class="progress">

<div></div>

</div>


</div>






<div class="card">


<h2>
Latest Signal
</h2>


<h2 class="green">

BUY BTC 🚀

</h2>


<p>

AI Confidence: 87%

</p>


</div>






<div class="card">


<h2>
Recent Trades
</h2>



<div class="trade">

BTC/USDT

<span class="green">
+$120
</span>

</div>



<div class="trade">

ETH/USDT

<span class="green">
+$85
</span>

</div>



<div class="trade">

SOL/USDT

<span class="red">
-$20
</span>

</div>



</div>







<div class="card">


<button onclick="bot()">

⚡ Start AI Trading

</button>


</div>





<div class="nav">

<div>
🏠 Home
</div>

<div>
📈 Market
</div>

<div>
🤖 AI
</div>

<div>
⚙️ Settings
</div>


</div>







<script>


let tg =
window.Telegram.WebApp;


tg.ready();


let user =
tg.initDataUnsafe.user;



if(user){

document.getElementById("user").innerHTML =
"Welcome "+user.first_name;

}

else{

document.getElementById("user").innerHTML =
"Telegram User";

}





function bot(){

tg.expand();

alert(
"AI Trading Engine Activated 🚀"
);

}


</script>



</body>

</html>
