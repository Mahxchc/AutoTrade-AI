<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>AutoTrade AI — پنل مدیریت</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body>
  <div class="bg bg-a"></div><div class="bg bg-b"></div><div class="noise"></div>
  <main class="shell">
    <header class="topbar glass">
      <div class="brand-wrap">
        <div class="brand-icon">A</div>
        <div><div class="eyebrow">AUTOTRADE AI</div><h1>پنل مدیریت</h1></div>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" aria-label="به‌روزرسانی">↻</button>
    </header>

    <section id="loading" class="glass state-card">
      <div class="spinner"></div><h2>در حال بررسی دسترسی...</h2><p>پنل فقط برای مدیر مجاز است.</p>
    </section>

    <section id="denied" class="glass state-card hidden">
      <div class="state-icon">🔒</div><h2>دسترسی مجاز نیست</h2><p id="deniedText">این صفحه فقط داخل Telegram و برای مدیر اصلی قابل استفاده است.</p>
    </section>

    <div id="panel" class="hidden">
      <section class="stats-grid">
        <article class="glass stat"><span>در انتظار</span><strong id="pendingCount">0</strong></article>
        <article class="glass stat"><span>تأییدشده</span><strong id="approvedCount">0</strong></article>
        <article class="glass stat"><span>ردشده</span><strong id="rejectedCount">0</strong></article>
        <article class="glass stat"><span>کل کاربران</span><strong id="totalCount">0</strong></article>
      </section>

      <section class="glass section-card">
        <div class="section-head"><div><span class="eyebrow">ACCESS CONTROL</span><h2>درخواست‌های جدید</h2></div><button id="pendingBtn" class="filter active" type="button">در انتظار</button></div>
        <div id="pendingList" class="user-list"></div>
      </section>

      <section class="glass section-card">
        <div class="section-head"><div><span class="eyebrow">USERS</span><h2>همه کاربران</h2></div><button id="allBtn" class="filter" type="button">همه</button></div>
        <div id="allList" class="user-list"></div>
      </section>
    </div>

    <div id="toast" class="toast hidden"></div>
  </main>
  <script src="/admin-assets/admin.js"></script>
</body>
</html>
