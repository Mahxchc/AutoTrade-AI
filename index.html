<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoTrade AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #020817;
            color: white;

            font-family: Tahoma, Arial, sans-serif;
        }

        .test-box {
            width: 90%;
            max-width: 400px;

            padding: 30px;

            text-align: center;

            border-radius: 20px;

            background: #0b2555;

            border: 1px solid #4b82ff;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 15px;

            color: #4b82ff;
        }

        p {
            color: #b8c7e3;

            line-height: 2;
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: 0;
            border-radius: 12px;

            background: linear-gradient(
                100deg,
                #2869f4,
                #7144ff
            );

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        #result {
            margin-top: 15px;

            color: #18d6a5;

            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="test-box">

        <h1>AutoTrade AI</h1>

        <p>
            اگر این صفحه را می‌بینی،
            فایل index.html به‌درستی اجرا شده است.
        </p>

        <button onclick="testIndex()">
            تست Index
        </button>

        <div id="result"></div>

    </div>


    <script>

        function testIndex() {

            document.getElementById("result").textContent =
                "✓ Index با موفقیت کار می‌کند";

        }

    </script>

</body>

</html>
