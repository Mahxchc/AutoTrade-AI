<!-- =====================================
..M AutoTrade AI
Mini App
File: MiniApp/index.html
===================================== -->

<!DOCTYPE html>

<html
    lang="fa"
    dir="rtl"
>

<head>

    <meta
        charset="UTF-8"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <title>
        AutoTrade AI
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
    ..M Background
    ===================================== -->

    <div class="background-glow glow-one"></div>

    <div class="background-glow glow-two"></div>

    <div class="background-glow glow-three"></div>


    <!-- =====================================
    ..M Loading
    ===================================== -->

    <div
        id="loading-screen"
        class="loading-screen"
    >

        <div class="loading-logo">
            AI
        </div>

        <div class="loading-title">
            AutoTrade AI
        </div>

        <div class="loading-text">
            در حال آماده‌سازی مینی اپ
        </div>

        <div class="loading-spinner"></div>

    </div>


    <!-- =====================================
    ..M Main App
    ===================================== -->

    <main
        id="app"
        class="app-container"
    ></main>


    <!-- =====================================
    ..M Toast
    ===================================== -->

    <div
        id="toast"
        class="toast"
    ></div>


    <!-- =====================================
    ..M Telegram WebApp
    ===================================== -->

    <script
        src="https://telegram.org/js/telegram-web-app.js"
    ></script>


    <!-- =====================================
    ..M Application
    ===================================== -->

    <script
        src="app.js"
    ></script>


</body>

</html>
